<svg width="1200" height="470" viewBox="0 0 1200 470"
xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- Main Background -->
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#080b10"/>
    <stop offset="55%" stop-color="#0d131a"/>
    <stop offset="100%" stop-color="#111a22"/>
</linearGradient>

<!-- Accent -->
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#64748b"/>
    <stop offset="50%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#64748b"/>
</linearGradient>

<!-- Glow -->
<filter id="glow">
    <feGaussianBlur stdDeviation="4"/>
</filter>

<!-- Moving shine -->
<linearGradient id="shine">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
    <stop offset="50%" stop-color="#38bdf8" stop-opacity=".8"/>
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>

    <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="-1 0"
        to="2 0"
        dur="5s"
        repeatCount="indefinite"/>
</linearGradient>

</defs>


<!-- ================================================= -->
<!-- MAIN PANEL -->
<!-- ================================================= -->

<rect
    x="8"
    y="8"
    width="1184"
    height="454"
    rx="24"
    fill="url(#bg)"
    stroke="#263440"
    stroke-width="2"/>


<!-- ================================================= -->
<!-- TECH GRID -->
<!-- ================================================= -->

<g opacity=".09" stroke="#94a3b8">

    <path d="M0 70H1200"/>
    <path d="M0 140H1200"/>
    <path d="M0 210H1200"/>
    <path d="M0 280H1200"/>
    <path d="M0 350H1200"/>
